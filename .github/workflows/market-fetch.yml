# PHƯƠNG ÁN B cho giá thị trường (GĐ3a) — chỉ cần khi Apps Script bị nguồn chặn IP Google.
# GitHub Actions (IP Microsoft) kéo giá SMM/LME/SHFE + tỷ giá VCB rồi POST vào Apps Script (action=storeMarket).
# CÁCH BẬT: repo Settings → Secrets and variables → Actions → New secret:
#   GAS_URL    = URL Web App Apps Script (…/exec)
#   GAS_SECRET = đúng mã SECRET trong Script properties
# Có secret là workflow tự chạy 12h05 trưa VN hằng ngày. Không có secret → tự bỏ qua, vô hại.
name: Fetch market prices (plan B)

on:
  schedule:
    # SMM đăng giá A00 khoảng 9:30–9:45 sáng VN (đo thật 24/08: 09:52 API đã
    # có giá hôm nay). Lấy sớm 2 lượt; 12:05 giữ làm lượt chốt (LME/SHFE về
    # muộn hơn). writeMarketRow_ ghi đè an toàn theo ngày + null không xoá số
    # cũ, nên chạy nhiều lượt/ngày là vô hại — lượt sau tự vá lượt trước.
    # Lưu ý: cron GitHub hay trễ 5–15 phút, nên đặt 9:45 để chắc chắn có giá.
    - cron: '45 2 * * 1-5'  # 09:45 sáng VN, thứ 2–6 — đón giá SMM vừa đăng
    - cron: '30 3 * * 1-5'  # 10:30 sáng VN — lượt vét nếu 9:45 SMM chưa kịp đăng
    - cron: '5 5 * * *'    # 12:05 trưa VN — lượt chốt: lấy giá + chụp nến
    # EastMoney chặn theo IP sau chỉ 1–2 request. Một lượt chạy dài không
    # bao giờ lấy đủ 7 file. Đổi chiến thuật: NHIỀU LƯỢT NGẮN, mỗi lượt
    # vớt vài file còn thiếu (chup-nen.mjs đã xếp thiếu-trước). File đã tươi
    # trong ngày thì bỏ qua, nên các lượt sau khi đủ bộ gần như không tốn gì.
    - cron: '0 */4 * * *'  # mỗi 4 giờ — CHỈ chụp nến, không đụng tới giá
  workflow_dispatch:

jobs:
  # Lấy giá SMM/LME/SHFE rồi POST vào Apps Script — MỖI NGÀY MỘT LẦN là đủ.
  # Chạy 6 lần/ngày sẽ ghi đè sheet MARKET_PRICES liên tục, vô ích và gây nhiễu
  # lịch sử. Nên job này chỉ theo lượt 12:05 (hoặc khi bấm chạy tay).
  fetch:
    # Chạy ở MỌI lịch TRỪ lịch chụp nến 4 giờ — thêm lượt giá mới không phải sửa dòng này
    if: github.event_name != 'schedule' || github.event.schedule != '0 */4 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch prices & push to Apps Script
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_SECRET: ${{ secrets.GAS_SECRET }}
        run: |
          if [ -z "$GAS_URL" ]; then echo "Chưa cấu hình GAS_URL — bỏ qua (plan B chưa bật)."; exit 0; fi
          python3 - <<'EOF'
          import json, os, re, urllib.request

          def get(url, timeout=30):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
              return urllib.request.urlopen(req, timeout=timeout).read().decode('utf-8', 'replace')

          def ww(kind):
              try:
                  d = json.loads(get(f'https://www.worthwillaluminium.com/api/price/{kind}'))
                  return d['data']['current'] if d.get('code') == 200 else None
              except Exception as e:
                  print(f'✗ {kind}: {e}'); return None

          def num(v):
              try: return float(str(v).replace(',', ''))
              except Exception: return None

          smm, lme, shfe = ww('smm'), ww('lme'), ww('shfe')
          # SMM: chỉ nhận khi payload ghi ĐÚNG NGÀY HÔM NAY (giờ VN). Chạy lúc
          # 9:45 mà SMM chưa đăng thì API còn trả giá hôm qua — ghi vào sẽ gắn
          # nhầm giá cũ cho ngày mới. Bỏ qua (null) thì writeMarketRow_ giữ
          # nguyên ô trống, lượt 10:30/12:05 sẽ điền. LME/SHFE giữ ngữ nghĩa
          # "giá đóng cửa gần nhất" như trước (date của chúng luôn lùi 1 ngày).
          import datetime
          hom_nay = (datetime.datetime.utcnow() + datetime.timedelta(hours=7)).strftime('%Y-%m-%d')
          if smm and str(smm.get('date'))[:10] != hom_nay:
              print(f"SMM còn giá ngày {smm.get('date')} (chưa đăng giá {hom_nay}) — bỏ qua lượt này, lượt sau sẽ điền.")
              smm = None
          usd = cny = None
          try:
              xml = get('https://portal.vietcombank.com.vn/Usercontrols/TVPortal.TyGia/pXML.aspx')
              pick = lambda c: num((re.search(f'CurrencyCode="{c}"[^/]*Transfer="([\\d.,]+)"', xml) or [None, None])[1])
              usd, cny = pick('USD'), pick('CNY')
          except Exception as e:
              print(f'✗ VCB: {e}')

          payload = {
              'secret': os.environ['GAS_SECRET'], 'action': 'storeMarket', 'by': 'github-actions',
              'payload': {
                  'smm': num(smm and smm.get('average')), 'smmMove': num(smm and smm.get('move')),
                  'lme': num(lme and (lme.get('average') or lme.get('end'))),
                  'shfe': num(shfe and (shfe.get('close_price') or shfe.get('settlement_price'))),
                  'usd': usd, 'cny': cny,
              },
          }
          print('Giá lấy được:', {k: v for k, v in payload['payload'].items()})
          req = urllib.request.Request(os.environ['GAS_URL'], data=json.dumps(payload).encode(),
                                       headers={'Content-Type': 'text/plain;charset=utf-8'})
          resp = urllib.request.urlopen(req, timeout=60).read().decode()
          print('Apps Script trả về:', resp)
          assert '"ok":true' in resp.replace(' ', ''), 'Apps Script báo lỗi!'
          EOF

  # ── Chụp nến EastMoney thành file tĩnh trong public/market/ ──────────────
  # LƯỚI AN TOÀN cho tab 📊 Biểu đồ Kỹ thuật. EastMoney chặn theo IP (22/08 cả
  # push2 lẫn push2his đều 502/đứt từ máy văn phòng). Runner GitHub đi IP khác
  # nên thường lấy được; nến chụp về là thứ trình duyệt lùi vào khi mất mạng.
  #
  # chup-nen.mjs TỰ KIỂM trước khi ghi: lệch quá 5 lần so với giá suy ra từ
  # turnover/volume là bỏ, không ghi đè file cũ. Đây chính là lỗi ngày 21/08 —
  # alm_60.json bị ghi giá 11.865.139 (giá thật ~23.700) làm vỡ biểu đồ.
  chup-nen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # BUOC MO KHOA: bot github-actions[bot] KHONG the them vao Bypass list cua
      # ruleset (repo ca nhan chi cho Roles/Deploy keys). Cach kha thi duy nhat:
      # push bang PAT cua chu repo -> nguoi day la admin -> khop muc bypass
      # "Repository admin" da them. Tao secret ten PUSH_NEN (fine-grained PAT,
      # Contents: Read and write, chi repo nay). Chua co secret thi fallback
      # github.token — luc do push se bi ruleset chan nhu cu.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_NEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chụp nến
        run: node tools/chup-nen.mjs
      - name: Commit nếu có thay đổi
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/market/
          if git diff --cached --quiet; then
            echo "Không có nến mới — bỏ qua."
          else
            git commit -m "chore(market): cập nhật ảnh chụp nến EastMoney"
            if git push; then
              echo "Đã cập nhật ảnh chụp nến lên main."
            else
              echo "::error::Luật bảo vệ nhánh đang chặn ghi vào main — ảnh chụp nến vừa lấy được đã BỊ BỎ."
              echo "::error::Cần secret PUSH_NEN: tạo fine-grained PAT (Contents: Read and write, chỉ repo này)"
              echo "::error::tại Settings cá nhân → Developer settings → Fine-grained tokens, rồi lưu vào"
              echo "::error::repo Settings → Secrets and variables → Actions → New repository secret, tên PUSH_NEN."
              echo "::error::Kèm điều kiện: ruleset main phải có Repository admin trong Bypass list (đã thêm 22/08)."
              exit 1
            fi
          fi
